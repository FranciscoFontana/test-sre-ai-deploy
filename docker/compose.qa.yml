# Entorno de QA: efímero, lo levanta el pipeline antes de correr el agente de IA
# y lo baja al terminar. SEED_BUG permite inyectar un bug para demostrar
# que el gate frena un deploy de verdad.
name: todo-qa

services:
  app:
    image: todo-app:${IMAGE_TAG:-dev}
    container_name: todo-qa-app
    ports:
      - "8081:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      SEED_BUG: "${SEED_BUG:-none}"
      GIT_SHA: "${IMAGE_TAG:-dev}"
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
