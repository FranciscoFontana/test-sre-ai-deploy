# Entorno de "producción" local. Persiste entre deploys y se reinicia solo.
# SEED_BUG queda fijo en none: producción nunca corre con bugs sembrados.
name: todo-prod

services:
  app:
    image: todo-app:${IMAGE_TAG:-dev}
    container_name: todo-prod-app
    ports:
      - "8080:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      SEED_BUG: "none"
      GIT_SHA: "${IMAGE_TAG:-dev}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
