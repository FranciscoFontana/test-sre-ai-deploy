<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todo App</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#16161d; --muted:#6b6b76; --line:#e4e4e9; --accent:#3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161d; --fg:#eceff4; --muted:#9a9aa6; --line:#2c2c36; --accent:#748ffc; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:2rem 1rem; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size:1.4rem; margin:0 0 .25rem; }
  .sub { color:var(--muted); font-size:.85rem; margin:0 0 1.5rem; }
  form { display:flex; gap:.5rem; margin-bottom:1.25rem; }
  input, select, button { font:inherit; padding:.5rem .7rem; border:1px solid var(--line);
                          border-radius:6px; background:var(--bg); color:var(--fg); }
  input { flex:1; min-width:0; }
  button { background:var(--accent); color:#fff; border-color:transparent; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:.6rem; padding:.6rem 0; border-bottom:1px solid var(--line); }
  li .title { flex:1; min-width:0; overflow-wrap:anywhere; }
  li.done .title { text-decoration:line-through; color:var(--muted); }
  .pri { font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
         border:1px solid var(--line); border-radius:4px; padding:.1rem .35rem; }
  .del { background:none; color:var(--muted); border:none; cursor:pointer; padding:.2rem .4rem; }
  .del:hover { color:#e03131; }
  .empty, .err { color:var(--muted); font-size:.9rem; padding:1rem 0; }
  .err { color:#e03131; }
  footer { margin-top:2rem; color:var(--muted); font-size:.75rem; }
</style>
</head>
<body>
<main>
  <h1>Todo App</h1>
  <p class="sub">App de prueba para el pipeline de deploy con QA por IA.</p>

  <form id="new-todo">
    <input id="title" placeholder="Nueva tarea..." autocomplete="off" required />
    <select id="priority">
      <option value="low">Baja</option>
      <option value="med" selected>Media</option>
      <option value="high">Alta</option>
    </select>
    <button type="submit">Agregar</button>
  </form>

  <div id="error" class="err" hidden></div>
  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>No hay tareas todavía.</p>

  <footer id="version"></footer>
</main>

<script type="module">
const list = document.getElementById("list");
const empty = document.getElementById("empty");
const errorBox = document.getElementById("error");

function showError(message) {
  errorBox.textContent = message;
  errorBox.hidden = !message;
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (res.status === 204) return null;
  const body = await res.json().catch(() => null);
  if (!res.ok) {
    throw new Error(body?.error?.message ?? `Error ${res.status}`);
  }
  return body;
}

function render(items) {
  list.replaceChildren();
  empty.hidden = items.length > 0;

  for (const todo of items) {
    const li = document.createElement("li");
    li.className = todo.done ? "done" : "";

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = todo.done;
    check.addEventListener("change", () => toggle(todo, check.checked));

    const title = document.createElement("span");
    title.className = "title";
    title.textContent = todo.title;

    const pri = document.createElement("span");
    pri.className = "pri";
    pri.textContent = todo.priority;

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "✕";
    del.setAttribute("aria-label", `Eliminar ${todo.title}`);
    del.addEventListener("click", () => remove(todo));

    li.append(check, title, pri, del);
    list.append(li);
  }
}

async function load() {
  try {
    showError("");
    const data = await api("/api/todos");
    render(data.items);
  } catch (err) {
    showError(err.message);
  }
}

async function toggle(todo, done) {
  try {
    showError("");
    await api(`/api/todos/${todo.id}`, {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ done }),
    });
    await load();
  } catch (err) {
    showError(err.message);
  }
}

async function remove(todo) {
  try {
    showError("");
    await api(`/api/todos/${todo.id}`, { method: "DELETE" });
    await load();
  } catch (err) {
    showError(err.message);
  }
}

document.getElementById("new-todo").addEventListener("submit", async (event) => {
  event.preventDefault();
  const titleInput = document.getElementById("title");
  const priorityInput = document.getElementById("priority");
  try {
    showError("");
    await api("/api/todos", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ title: titleInput.value, priority: priorityInput.value }),
    });
    titleInput.value = "";
    await load();
  } catch (err) {
    showError(err.message);
  }
});

api("/version")
  .then((v) => {
    document.getElementById("version").textContent = `v${v.version} · ${v.gitSha}`;
  })
  .catch(() => {});

load();
</script>
</body>
</html>
